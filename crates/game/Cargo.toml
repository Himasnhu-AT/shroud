[package]
name = "game"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "shroud"
path = "src/main.rs"

[dependencies]
brain = { path = "../brain" }
bevy = { version = "=0.19.1", features = ["jpeg"] }
avian3d = "=0.7.0"
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
directories = "6"
# Crash & performance reporting: always on (a no-op tracer unless SHROUD_TRACE_ENDPOINT/KEY are set).
ashlar-trace = { path = "/Users/himanshu/codes/synthai/ashlar/crates/trace", features = ["sysinfo"] }
# Test-only control port (TCP + MCP), behind the `control` feature.
ashlar-control = { path = "/Users/himanshu/codes/synthai/ashlar/crates/control", optional = true }
ashlar-command = { path = "/Users/himanshu/codes/synthai/ashlar/crates/command", optional = true }
ashlar-mcp = { path = "/Users/himanshu/codes/synthai/ashlar/crates/mcp", optional = true }

[features]
# `control` is on for dev builds and tests. Release packaging builds with
# `--no-default-features`, so the shipped binary has no control port, no flags and none of its crates.
default = ["control"]
control = ["dep:ashlar-control", "dep:ashlar-command", "dep:ashlar-mcp"]

[dev-dependencies]
ashlar-control = { path = "/Users/himanshu/codes/synthai/ashlar/crates/control" }
