[package]
name = "game"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "shroud"
path = "src/main.rs"

[dependencies]
brain = { path = "../brain" }
# The game shell: window, settings, menus, pause, UI kit, input, audio, FPS controller, render
# budget; devtools/trace only through the `dev` feature below.
engine = { git = "https://github.com/himasnhu-AT/hull-dep", rev = "caf33e1887e106de3409c7796d0e244bfa30858e", default-features = false, features = ["physics", "fps", "vfx", "look", "bake", "anim", "ktx2"] }
bevy = { version = "=0.20.1", features = ["jpeg"] }
avian3d = "=0.8.0"
rand.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# `dev` is on for `cargo run` / `cargo test`: control port, MCP, offscreen capture, perf overlay,
# metrics window, crash/perf tracing. Ship builds use `--no-default-features`: none of it (and
# no `ashlar-*` crate) is in the binary.
default = ["dev"]
dev = ["engine/devtools", "telemetry"]
# Crash, performance and match reports to the studio's server (engine `trace`, i.e. `ashlar-trace`
# only: no control port, MCP or devtools). Release builds turn it on with
# `--no-default-features --features telemetry` (scripts/release.sh); it sends only when the build
# baked a server address and write key in (SHROUD_BUILD_TRACE_ENDPOINT / SHROUD_BUILD_TRACE_KEY) or
# SHROUD_TRACE_ENDPOINT / SHROUD_TRACE_KEY are set, and players can switch it off in Settings.
telemetry = ["engine/trace"]

[dev-dependencies]
# Same git rev as the engine's, so tests share its control client and build on any machine.
ashlar-control = { git = "https://github.com/Himasnhu-AT/ashlar", rev = "561745aaf96e07a0efe2ed61f37b0a365f46a530" }
