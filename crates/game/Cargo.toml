[package]
name = "game"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "shroud"
path = "src/main.rs"

[dependencies]
brain = { path = "../brain" }
# The game shell: window, settings, menus, pause, UI kit, input, audio, FPS controller, render
# budget; devtools/trace only through the `dev` feature below.
engine = { path = "/Users/himanshu/codes/game/engine", default-features = false, features = ["physics", "fps", "vfx", "look", "anim", "ktx2"] }
bevy = { version = "=0.20.1", features = ["jpeg"] }
avian3d = "=0.8.0"
rand.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# `dev` is on for `cargo run` / `cargo test`: control port, MCP, offscreen capture, perf overlay,
# metrics window, crash/perf tracing. Ship builds use `--no-default-features`: none of it (and
# no `ashlar-*` crate) is in the binary.
default = ["dev"]
dev = ["engine/devtools", "engine/trace"]

[dev-dependencies]
ashlar-control = { path = "/Users/himanshu/codes/synthai/ashlar/crates/control" }
