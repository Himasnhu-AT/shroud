[workspace]
resolver = "3"
members = ["crates/brain", "crates/game"]

[workspace.package]
edition = "2024"
version = "0.2.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Fast-ish debug builds: optimize dependencies, keep our code debuggable.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# `"*"` covers dependencies only, not workspace members: the AI (nav A*, squad Dijkstra,
# sims) ran at opt-level 1 in every dev run, costing ms per frame.
[profile.dev.package.brain]
opt-level = 3

[profile.dev.build-override]
opt-level = 0

# Shipping builds (scripts/package-macos.sh): optimized, stripped, thin LTO.
[profile.release]
lto = "thin"
strip = true
debug = false
codegen-units = 1
